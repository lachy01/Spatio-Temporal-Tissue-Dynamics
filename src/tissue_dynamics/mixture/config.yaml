# All hyperparameters for the concomitant-variable Poisson mixture.
# No magic numbers in code -- everything tunable lives here.

data:
  xenium_dir: data/Xenium_Prime_Breast_Cancer_FFPE
  # celltype_major, 9 components -- the CURRENT table (regenerated after the
  # normalisation was updated). Rowsums are constant at -7, so spec 3.1
  # branch (a) applies: sum-to-zero projection to 8 dimensions.
  phi_csv: data/phispace_normalised.csv
  # celltype_minor, 29 components, same normalisation as the major table
  # (compositional, rowsums constant at -27). Used only as the blood-endothelium
  # source for the oxygen field: the major table's single "Endothelial" column
  # would fold in lymphatic endothelium, which is deliberately excluded.
  phi_minor_csv: data/phispace_minor_normalised.csv
  table_parquet: data/mixture_cells_major.parquet
  # Density and the neighbourhood mean now share ONE radius. 50um was inherited
  # from the earlier NB models and had no justification of its own; matching it
  # to the 80um neighbourhood makes `n` and `phibar` properties of the same disc,
  # which the phase-portrait state variable X_k = n * wbar_k requires. Stage D
  # showed the estimands are insensitive to the density definition (fixed-k kNN
  # moved the fold change by 0.0%), so this is low risk.
  # Spec 1.3 prefers fixed-k kNN; still a recorded deviation, tested in Stage D.
  density_radius_um: 80.0
  neighbour_radius_um: 80.0
  # Spec 1.2 item 2: N must exclude the outcome genes AND the blocklist. The
  # blocklist is the set of panel genes correlated with the Tirosh set, removed
  # from the PhiSpace input so the cell-state covariates cannot carry cell-cycle
  # signal into the mixing weight. It is a superset of the Tirosh genes (all 53
  # are on it) and covers 13.47% of the total library -- far from negligible,
  # which is why the spec insists on it.
  blocklist_csv: data/blocklist.csv
  corr_logN_logarea_orthogonalise_above: 0.9

state:
  # Spec 1.1 phi_00..phi_28 = the 29-component celltype_minor PhiSpace.
  # The four explicitly cycling archetypes are dropped from the cell's OWN
  # state: their reference centroids are defined by cell-cycle genes, they
  # correlate 0.47-0.57 with log1p(y_count), and putting them in the mixing
  # weight would predict P(cycling) from a cycling score built on the
  # outcome's own transcripts. They are KEPT in the neighbourhood state,
  # where "how many of my neighbours are cycling" is a real biological
  # predictor and phi_bar excludes the cell itself.
  # celltype_major has no cycling archetypes at all, so this list is empty and
  # the own/neighbour blocks are identical in width. It matters only for the
  # celltype_minor table, where "Cancer Cycling" and friends are defined by
  # cell-cycle genes and would leak the outcome into the mixing weight.
  cycling_archetypes: []
  drop_cycling_from_own: true
  drop_cycling_from_neighbour: false
  condition_number_max: 1.0e6      # spec 3.1 branch (b) PCA fallback trigger
  pca_variance_keep: 0.999

oxygen:
  blood_endothelium:
    - "Endothelial ACKR1"
    - "Endothelial RGS5"
    - "Endothelial CXCL12"
  h_um: 5.0
  L0_um: 100.0
  beta: 1.0
  # The source score is now built from a COMPOSITIONAL table, where summing the
  # three blood-endothelial columns is invalid: their rowsum constraint makes
  # them fight (the summed score correlates -0.95 with ACKR1 but +1.00 with
  # RGS5). The max z-score across the three is the compositional-safe analogue.
  # `cutoff` is then a quantile, not an absolute level, so it is scale-free:
  # keep the top `source_quantile` of cells as sources, matching the ~2.6% the
  # field was originally validated with.
  source_quantile: 0.026

model:
  # s(log area) in the component rates. Raised from the spec's 4 on evidence:
  # the Test 07 confound floor -- the fold change the model invents from pure
  # size misspecification -- falls from 2.84 at df=4 to 1.84 at df=8, while the
  # real-data fold change is invariant (5.581 / 5.577 / 5.581 / 5.579 at
  # df = 4 / 8 / 12 / 16). df=8 therefore maximises the ratio of real signal to
  # artefact (3.03) at no cost to the estimate.
  area_spline_df: 8
  background_spline_df: 3          # g(log density), Stage C
  weight_density_spline_df: 3      # h(log density); spec 9.10 forbids raising
  rank: 2                          # bilinear B = U V^T, swept in Test 11
  ridge_tau: 1.0e-4                # spec 3.2 conditioning term on U, V
  ridge_tau_sensitivity: [0.0, 1.0e-4, 1.0e-3]
  # Ridge on EVERY weight coefficient (a, c, h, psi, U, V). Added to the spec:
  # without it the concomitant logistic model separates on null data (||a||=57.5,
  # sd(eta)=203, pi at 0/1 for 98.6% of cells), which is the Test 03 / Test 07
  # failure. Selected by held-out log-likelihood on contiguous spatial blocks,
  # for the reason spec 6.11 gives for rank selection.
  # null => select by CV. NOTE on the selection rule: held-out log-likelihood
  # cannot score this parameter. pi is a prior on a LATENT class, so errors in
  # it are heavily damped in the marginal density, which the count model
  # dominates. The first CV array showed held-out likelihood monotonically
  # preferring lambda=0 (paired t = -3.1 to -17.3, perfectly ordered) -- i.e.
  # preferring the specification where sigma_1(B) = 30 and the weight model is
  # diverging. The penalty is not a bias-variance knob here; it is what makes
  # the estimator well posed. Select the SMALLEST lambda giving a converged,
  # non-degenerate fit, and use held-out likelihood only to break ties.
  # 10, from the second Spartan cv_penalty array. Two independent lines agree:
  # sigma_1(B) plateaus at ~1.0 for lambda in [10, 100] (1.24 / 1.05 / 0.99) and
  # explodes below (3.60 at lambda=3, 26.6 at 0.3, 38.3 at 0), which is the
  # signature of a variance-dominated estimate rather than a real interaction;
  # and the Test 03 null only collapses at lambda >= 10. Convergence alone was
  # not a sufficient criterion -- lambda=0.3 converged on all five folds and
  # still returned sigma_1 = 26.6, sixty times the true value in Test 01 (0.440).
  # The sample size weight_ridge was calibrated at. The penalty is scaled by
  # n / weight_ridge_n_reference, so it stays constant PER OBSERVATION. Without
  # this a fixed lambda shrinks a subsample much harder than the full sample and
  # mean(pi) drifts with n (spec 6.10). At the full sample the scaling is 1, so
  # every result reported so far is unchanged.
  # Per-cell-type density slope in the mixing weight. A single shared h()
  # averages opposite mechanisms: adjusted for detection and neighbourhood
  # composition, log density raises the cycling odds for Myeloid (+0.238),
  # Endothelial (+0.206), Normal Epithelial (+0.205), PVL (+0.199) and CAFs
  # (+0.152) but LOWERS them for Cancer Epithelial (-0.031, z = -4.1). The
  # shared term comes out monotonically increasing and gets the tumour's
  # contact inhibition backwards -- which matters because the phase portrait's
  # competition term runs through exactly this channel.
  density_interaction: true
  weight_ridge_n_reference: 678885
  weight_ridge: 10
  weight_ridge_grid: [0.0, 0.3, 1.0, 3.0, 10.0, 30.0, 100.0, 300.0]
  cv_folds: 5
  theta_config: both               # F (theta=1) and V (theta free); a bracket

init:
  delta: 0.0940                    # e^delta = log(3): threefold rate in cycling
  a0_cycling_fraction: 0.10
  random_scale: 0.01
  n_restarts: 20

optim:
  # Raised from the spec's 2000 on evidence from the first Spartan cv_penalty
  # array: at 2000 iterations NOTHING converged below weight_ridge=100 (median
  # ||grad||inf 142 at lambda=0, 0.63 at lambda=10, 0.0053 at lambda=30 against
  # a 1e-5 threshold). Those fits stopped at the cap, so their held-out scores
  # were not estimates of anything. lambda=10 and 30 are close and should settle
  # with more iterations; lambda=0 looks to be diverging rather than converging
  # slowly, which is itself the evidence that it is not a valid specification.
  # A task ran 2000 iterations in ~8 minutes on 4 Spartan cores.
  maxiter: 20000
  rel_tol_loglik: 1.0e-9
  grad_inf_tol: 1.0e-5
  em_max_iter: 500
  em_monotonicity_tol: 1.0e-8

# Test 08 (spec 6.8), the held-out gene validation
n_gene_splits: 5
n_permutations: 100

prototype:
  n_cells: 50000
  archetype: "Cancer Epithelial"
  seed: 0

inference:
  n_blocks_target: 250
  n_bootstrap: 300
  n_bootstrap_prototype: 50
  # Spec 7.1 says to cap replicates at 300 L-BFGS iterations. That was written
  # before we knew a full-n fit needs ~5,650 iterations cold: at 300, all 300
  # replicates stopped at the cap with ||grad||inf median 105 (the point
  # estimate reached 1.3e-05). Warm-starting helps but not enough, and
  # under-iterating from a COMMON warm start shrinks the spread toward it, so
  # the percentile intervals come out too narrow. Raised; compare interval
  # widths against the 300-iteration run to confirm they have stabilised.
  bootstrap_maxiter: 5000
  max_failure_rate: 0.05

# Test 08 (spec 6.8), the held-out gene validation. The half-set counts must
# already be in the table -- run/add_gene_splits.py adds them; they cannot be
# derived from the summed y_count.
n_gene_splits: 5
n_permutations: 100

# Spec 2.2 / 6.12: theta as a BRACKET. Configuration F pins the log-library-size
# coefficient at 1 (a pure rate model, blocking the path from cycling to count);
# V estimates it, partly unblocking that path by an amount chosen by likelihood
# rather than by causal argument. Spec 9.11 forbids selecting between them by
# fit -- both are reported.
bracket_restarts: 5
stage_d_restarts: 3
knn_density_k: 30      # spec 1.3's fixed-k density, tested as a Stage D variant
stability_sizes: [50000, 200000, 0]   # 0 = the full sample (spec 6.10)
# 20, matching spec 4.4's multi-start requirement. 5 was not enough: at reduced
# n the surface is genuinely multimodal -- at 200,000 cells all five restarts
# found DIFFERENT optima spanning 502 log-likelihood units, and the winner was a
# B = 0 solution beating four B != 0 solutions by 47 units. At the full sample
# 4 of 5 agree and B != 0 wins by 1,089. Comparing a 5-restart subsample fit
# against a 20-restart full-sample fit is not a like-for-like stability test.
stability_reps: 20
# 0 = h() dropped entirely (spec 6.13). df=2 is omitted: patsy's cr() cannot
# build a 2-df natural cubic basis (it raises before the fit starts), so those
# tasks produced no output at all in the first run. Spec 6.13 asks for
# df in {2,3,5}; 2 is unavailable with this basis, which is a documented gap.
density_df_grid: [0, 3, 5]
