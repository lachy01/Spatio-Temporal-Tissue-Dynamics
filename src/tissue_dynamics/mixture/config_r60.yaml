# Phase portrait sensitivity (portrait spec 9, "neighbourhood radius"; 2026-10-20):
# the breast section with the neighbourhood disc and the density radius at 60 um
# instead of 80. Contact stays 0-15 um, so regional becomes 15-60 um. Same cells,
# same MisTIC columns (run/portrait_radius_tables.py builds the table); every model
# setting is production's. Active when MIX_DATASET=r60; fits go to outputs/hpc_r60.
data:
  neighbour_radius_um: 60.0
  density_radius_um: 60.0
  table_parquet: data/radius/mixture_cells_r60.parquet
init:
  n_restarts: 10
