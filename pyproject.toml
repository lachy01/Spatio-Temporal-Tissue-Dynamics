[project]
name = "tissue-dynamics"
version = "0.1.0"
description = "Infer spatial cell-fate (division/death) dynamics from spatial transcriptomics data and Phi-Space cell-state embeddings"
requires-python = ">=3.9"
dependencies = [
    "anndata>=0.10",
    "scanpy>=1.9",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "torch>=2.0",
    "matplotlib",
]

[project.optional-dependencies]
xenium-io = ["spatialdata-io>=0.1"]
parquet = ["pyarrow"]
download = ["requests"]
stats = ["statsmodels"]
test = ["pytest", "statsmodels"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = ["slow: long-running mixture validation tests (spec section 6)"]
